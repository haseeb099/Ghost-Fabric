name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests with coverage report (informational)
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
          echo "Coverage report is informational baseline only; not a product SLA gate."
      - run: python scripts/check_openapi.py

  chameleon-control-plane:
    name: CHAMELEON Raft prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chameleon-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -d .
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-smoke:
    name: Compose PostgreSQL smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up --build -d db api
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Exercise durable audit path
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/scenario/reset \
            -H "Authorization: Bearer operator-token" \
            -H "X-Command-ID: ci-reset-1"
          curl -fsS http://127.0.0.1:8000/api/v1/audit/export \
            -H "Authorization: Bearer operator-token" | python -c "import sys,json; data=json.load(sys.stdin); assert data['event_count']>=1; assert data['persistence']=='postgres'"
      - if: always()
        run: docker compose down -v

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform validate
      - name: Guardrail — apply forbidden in quality gate
        working-directory: .
        run: |
          if grep -niE "terraform[[:space:]]+apply" .github/workflows/quality.yml; then
            echo "terraform apply must not appear in the quality gate"
            exit 1
          fi
          echo "OK: quality gate never applies infrastructure"

  end-to-end:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
      - run: npx vite --host 127.0.0.1 &
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
