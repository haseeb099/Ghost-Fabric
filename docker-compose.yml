services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghost_fabric
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost_fabric"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ghost_fabric_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      AUDIT_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://ghost:ghost@db:5432/ghost_fabric
      RESTORE_ACTIVE_RUN: "true"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      AUTH_MODE: required
      AUTH_TOKENS: viewer-token=viewer:DEMO-VIEWER,operator-token=operator:DEMO-OPERATOR
      DEFAULT_ACTOR: DEMO-VIEWER
      DEFAULT_ROLE: viewer
      LOG_LEVEL: INFO
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ghost_fabric_pg:
